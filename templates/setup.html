{% extends 'base.html' %}{% block body %}
<div class="card narrow"><h2>تجهيز منظومة المسار لأول مرة</h2>
<p class="mut">أدخل بيانات حساب المدير. اسم المكتب مثبت على: مكتب ZIGO للسفر والسياحة والعمرة.</p>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}">
<input type="hidden" name="office_name" value="مكتب ZIGO للسفر والسياحة والعمرة">
<label>العملة الأساسية (رمزها مثل LYD)</label><input name="currency" value="LYD" required>
<label>اسم المدير</label><input name="name" required>
<label>رقم الهاتف (يُستخدم للدخول)</label><input name="phone" required>
<label>كلمة المرور (6 خانات فأكثر)</label><input type="password" name="password" required>
<p><button>حفظ وبدء</button></p></form></div>{% endblock %}
